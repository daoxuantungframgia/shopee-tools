<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chia Link Thành Nhóm (Lọc Trùng + Trộn Ngẫu Nhiên)</title>
    <style>
      body {
        font-family: 'Inter', Arial, sans-serif;
        background-color: #f4f6fa;
        color: #333;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        background: #fff;
        padding: 25px 30px;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      }

      h1 {
        text-align: center;
        color: #1a73e8;
        font-size: 26px;
        margin-bottom: 25px;
      }

      label {
        font-weight: 600;
        display: block;
        margin-bottom: 6px;
      }

      textarea {
        width: 100%;
        height: 200px;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        resize: vertical;
        font-family: monospace;
        margin-bottom: 20px;
      }

      .controls {
        display: flex;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
      }

      input[type='number'] {
        width: 120px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }

      #groupName {
        width: 400px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        background-color: #1a73e8;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background-color: #0f5fd0;
      }

      .output {
        margin-top: 30px;
      }

      .group-box {
        background: #fdfdfd;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        margin-top: 15px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.05);
      }

      .group-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 15px;
        background: #f0f4ff;
        border-bottom: 1px solid #e0e0e0;
        border-radius: 8px 8px 0 0;
      }

      .group-links {
        padding: 10px 15px;
        white-space: pre-wrap;
        font-family: monospace;
        background: #fafafa;
        border-radius: 0 0 8px 8px;
        max-height: 180px;
        overflow-y: auto;
      }

      .copy-btn {
        background: #1a73e8;
        font-size: 13px;
      }

      .copy-btn:hover {
        background: #155fc5;
      }

      .copied {
        background: #00c851 !important;
        cursor: default !important;
      }

      .copied:hover {
        background: #00c851 !important;
      }

      @media (max-width: 600px) {
        .controls {
          flex-direction: column;
          align-items: flex-start;
        }
        input[type='number'],
        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔗 Chia Link Thành Nhóm (Lọc Trùng + Trộn Ngẫu Nhiên)</h1>

      <label for="inputLinks">Danh sách link (mỗi link một dòng):</label>
      <textarea
        id="inputLinks"
        placeholder="Dán danh sách link vào đây..."
      ></textarea>

      <div class="controls">
        <div style="display: flex; align-items: center; margin-bottom: 12px">
          <label for="groupName" style="margin-right: 8px">Tên nhóm:</label>
          <input id="groupName" type="text" value="" />
        </div>
      </div>

      <div class="controls">
        <div>
          <label for="groupSize">Số link mỗi nhóm:</label>
          <input id="groupSize" type="number" value="1000" min="1" />
        </div>
        <button id="splitButton">Chia sản phẩm</button>
        <button id="splitButton2">Chia sản phẩm không đảo</button>
      </div>

      <div id="output" class="output"></div>
    </div>

    <script>
      const splitButton = document.getElementById('splitButton');
      const splitButton2 = document.getElementById('splitButton2');
      const output = document.getElementById('output');

      splitButton.addEventListener('click', () => {
        const text = document.getElementById('inputLinks').value.trim();
        const groupSize =
          parseInt(document.getElementById('groupSize').value) || 1000;
        let links = text.split(/\r?\n/).filter((line) => line.trim() !== '');

        output.innerHTML = '';

        if (links.length === 0) {
          alert('⚠️ Vui lòng nhập ít nhất 1 link!');
          return;
        }

        // 🧹 Bước 1: Lọc bỏ trùng (unique)
        links = [...new Set(links)];

        // 🔀 Bước 2: Trộn ngẫu nhiên cực mạnh (Fisher–Yates)
        for (let i = links.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [links[i], links[j]] = [links[j], links[i]];
        }

        // 🔁 Bước 3: Trộn thêm vài lần để tăng ngẫu nhiên
        for (let k = 0; k < 3; k++) {
          links.sort(() => Math.random() - 0.5);
        }

        // 📦 Bước 4: Chia nhóm
        const totalGroups = Math.ceil(links.length / groupSize);

        for (let i = 0; i < totalGroups; i++) {
          const chunk = links.slice(i * groupSize, (i + 1) * groupSize);
          const box = document.createElement('div');
          box.className = 'group-box';
          box.innerHTML = `
            <div class="group-header">
              <strong>Nhóm ${i + 1} (${chunk.length} link)</strong>
              <button class="copy-btn">Copy</button>
            </div>
            <div class="group-links">${chunk.join('\n')}</div>
          `;
          output.appendChild(box);
        }

        // 📋 Bước 5: Chức năng copy nhanh
        document.querySelectorAll('.copy-btn').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            const box = e.target.closest('.group-box');
            const textToCopy = box.querySelector('.group-links').innerText;

            try {
              await navigator.clipboard.writeText(textToCopy);
              btn.classList.add('copied');
              btn.innerText = '✅ Đã Copy';
            } catch (err) {
              alert('❌ Trình duyệt không cho phép copy tự động.');
            }
          });
        });

        // 🧾 Hiển thị thông báo tổng số link sau khi lọc
        const info = document.createElement('p');
        info.style.marginTop = '15px';
        info.style.fontWeight = '600';
        info.style.color = '#1a73e8';
        info.innerText = `✅ Tổng: ${links.length} link (đã lọc trùng)`;
        output.prepend(info);
      });

      splitButton2.addEventListener('click', () => {
        const text = document.getElementById('inputLinks').value.trim();
        const groupSize =
          parseInt(document.getElementById('groupSize').value) || 1000;
        let links = text.split(/\r?\n/).filter((line) => line.trim() !== '');

        output.innerHTML = '';

        if (links.length === 0) {
          alert('⚠️ Vui lòng nhập ít nhất 1 link!');
          return;
        }

        // 🧹 Bước 1: Lọc bỏ trùng (unique)
        links = [...new Set(links)];

        // 📦 Bước 4: Chia nhóm
        const totalGroups = Math.ceil(links.length / groupSize);

        for (let i = 0; i < totalGroups; i++) {
          const chunk = links.slice(i * groupSize, (i + 1) * groupSize);
          const box = document.createElement('div');
          box.className = 'group-box';
          box.innerHTML = `
            <div class="group-header">
              <strong>Nhóm ${i + 1} (${chunk.length} link)</strong>
              <button class="copy-btn">Copy</button>
            </div>
            <div class="group-links">${chunk.join('\n')}</div>
          `;
          output.appendChild(box);
        }

        // 📋 Bước 5: Chức năng copy nhanh
        document.querySelectorAll('.copy-btn').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            const box = e.target.closest('.group-box');
            const textToCopy = box.querySelector('.group-links').innerText;

            try {
              await navigator.clipboard.writeText(textToCopy);
              btn.classList.add('copied');
              btn.innerText = '✅ Đã Copy';
            } catch (err) {
              alert('❌ Trình duyệt không cho phép copy tự động.');
            }
          });
        });

        // 🧾 Hiển thị thông báo tổng số link sau khi lọc
        const info = document.createElement('p');
        info.style.marginTop = '15px';
        info.style.fontWeight = '600';
        info.style.color = '#1a73e8';
        info.innerText = `✅ Tổng: ${links.length} link (đã lọc trùng)`;
        output.prepend(info);
      });
    </script>
  </body>
</html>
